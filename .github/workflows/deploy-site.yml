name: Deploy website

# Builds the Astro site in website/ and publishes it to GitHub Pages.
# Triggers only when the site (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-site.yml"
      # Renaming a release alias must re-run the drift check.
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Fails the deploy if the site links an installer the release workflow
      # does not upload — a dead download button is worse than a late deploy.
      - run: npm run check:downloads
      - run: npm run build
      - run: npm run check:page
      - run: npm run check:copy
      # Refuses to deploy a page advertising downloads that do not exist yet.
      # This enforces the rollout order: tag the release first, then deploy the
      # site. Skipped automatically if GitHub is unreachable, so a network blip
      # cannot block an otherwise-correct deploy.
      - run: npm run check:live
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
